name: Unitera Canonical CI Relay
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit
        required: true
        type: string
      base_sha:
        description: Exact source base commit
        required: true
        type: string
      expected_relay_sha:
        description: Exact reviewed relay commit
        required: true
        type: string
      source_pr:
        description: Source pull request number
        required: true
        type: string
permissions: {}
concurrency:
  group: relay-quarantine
  cancel-in-progress: false
jobs:
  execution-pin:
    runs-on: [self-hosted, Linux, X64, unitera-ci, relay]
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check execution inputs before any other operation
        shell: bash
        env:
          EXPECTED_RELAY_SHA: ${{ inputs.expected_relay_sha }}
          ACTUAL_RELAY_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_PR: ${{ inputs.source_pr }}
        run: |
          set -euo pipefail
          for value in "$EXPECTED_RELAY_SHA" "$SOURCE_SHA" "$BASE_SHA"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || exit 2
          done
          [[ "$SOURCE_PR" =~ ^[1-9][0-9]*$ ]] || exit 2
          test "$ACTUAL_RELAY_SHA" = "$EXPECTED_RELAY_SHA"
          echo RELAY_EXECUTION_PIN_PASS
  isolation-blocked:
    needs: [execution-pin]
    runs-on: [self-hosted, Linux, X64, unitera-ci, relay]
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse admission until disposable VM qualification
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::RELAY_QUARANTINED: disposable VM lane is not qualified"
          exit 1

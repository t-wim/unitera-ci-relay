name: Governance Guardrails

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'services/**'
      - 'db/**'
      - 'docs/**'
      - 'tools/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/governance-guardrails.yml'
  push:
    branches: [main]

env:
  CI: true

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: governance:check (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Enforce Node 24
        run: |
          node -e "const major = process.versions.node.split('.')[0]; if (major !== '24') { console.error('Expected Node 24.x, got ' + process.version); process.exit(1); }"
      - name: Enforce PR author/reviewer separation
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/check-pr-identity-separation.mjs
      - run: pnpm install --frozen-lockfile
      - name: Fail if tracked generated artifacts are present
        run: |
          TRACKED=$(git ls-files | grep -E '(^|/)(\.next|dist|build|coverage|out)(/|$)' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::Tracked generated artifacts found."
            echo "$TRACKED"
            exit 1
          fi
      - run: pnpm governance:check

  ci-matrix:
    name: ${{ matrix.name }} (Node 24)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test:domain
            command: pnpm test:domain
            requires_docker: false
            requires_workspace_build: false
            database_url: ''
            database_ssl: ''
          - name: test:policy
            command: pnpm exec vitest run packages/policy
            requires_docker: false
            requires_workspace_build: false
            database_url: ''
            database_ssl: ''
          - name: test:llm
            command: pnpm test:llm
            requires_docker: false
            requires_workspace_build: true
            database_url: ''
            database_ssl: ''
          - name: review test
            command: UNITERA_TESTCONTAINERS=1 pnpm test:review
            requires_docker: true
            requires_workspace_build: false
            database_url: ''
            database_ssl: ''
          - name: test:api:unit-baseline
            command: pnpm test:api:unit-baseline
            requires_docker: false
            requires_workspace_build: true
            database_url: ''
            database_ssl: ''
          - name: test:api:integration:core-commitment
            command: pnpm test:api:integration:core-commitment
            requires_docker: true
            requires_workspace_build: true
            database_url: ''
            database_ssl: ''
          - name: test:api:integration:rls-runtime
            command: pnpm test:api:integration:rls-runtime
            requires_docker: true
            requires_workspace_build: true
            database_url: ''
            database_ssl: ''
          - name: test:api:integration:audit-strict
            command: pnpm test:api:integration:audit-strict
            requires_docker: true
            requires_workspace_build: true
            database_url: ''
            database_ssl: ''
          - name: test:api:integration:execution-dispatch-migration
            command: pnpm test:api:integration:execution-dispatch-migration
            requires_docker: true
            requires_workspace_build: true
            database_url: ''
            database_ssl: ''
          - name: test:api:integration:rate-limit-store
            command: pnpm test:api:integration:rate-limit-store
            requires_docker: true
            requires_workspace_build: true
            database_url: ''
            database_ssl: ''
          # PPG-002 tenant genesis: atomic materialization, the single-use /
          # idempotent-replay law, cross-tenant isolation and the runtime-role
          # lockout, all against the real migration chain.
          - name: test:api:integration:tenant-genesis-materialization
            command: pnpm test:api:integration:tenant-genesis-materialization
            requires_docker: true
            requires_workspace_build: true
            database_url: ''
            database_ssl: ''
          # SEC-01 genesis ledger privileges: the 0059 ACL normalization
          # (venue-excess revoke + standing assertion), the first
          # LOGIN-principal lockout probes, and deliberate-excess mutation
          # detection against the real migration chain.
          - name: test:api:integration:tenant-genesis-ledger-privileges
            command: pnpm test:api:integration:tenant-genesis-ledger-privileges
            requires_docker: true
            requires_workspace_build: true
            database_url: ''
            database_ssl: ''
          - name: test:company-brain
            command: UNITERA_TESTCONTAINERS=1 pnpm test:company-brain
            requires_docker: true
            requires_workspace_build: false
            database_url: ''
            database_ssl: ''
          - name: test:web
            command: pnpm test:web
            requires_docker: false
            requires_workspace_build: true
            database_url: ''
            database_ssl: ''
          - name: build:web
            command: pnpm build:web
            requires_docker: false
            requires_workspace_build: false
            database_url: ''
            database_ssl: ''
          - name: migrate
            command: pnpm db:migrate
            requires_docker: false
            requires_workspace_build: false
            database_url: postgresql://unitera:unitera@localhost:5432/unitera_ci
            database_ssl: 'false'
          - name: drift-check
            command: pnpm db:migrate && pnpm db:drift-check
            requires_docker: false
            requires_workspace_build: false
            database_url: postgresql://unitera:unitera@localhost:5432/unitera_ci
            database_ssl: 'false'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: unitera_ci
          POSTGRES_USER: unitera
          POSTGRES_PASSWORD: unitera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unitera -d unitera_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Enforce Node 24
        run: |
          node -e "const major = process.versions.node.split('.')[0]; if (major !== '24') { console.error('Expected Node 24.x, got ' + process.version); process.exit(1); }"
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages for API gates
        if: ${{ matrix.requires_workspace_build }}
        run: pnpm build:packages
      - name: Verify Docker for Testcontainers gates
        if: ${{ matrix.requires_docker }}
        run: docker version
      - name: Run matrix gate
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SSL: ${{ matrix.database_ssl }}
        run: ${{ matrix.command }}

  rls-runtime:
    name: rls-runtime:test (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Enforce Node 24
        run: |
          node -e "const major = process.versions.node.split('.')[0]; if (major !== '24') { console.error('Expected Node 24.x, got ' + process.version); process.exit(1); }"
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages for API gate
        run: pnpm build:packages
      - name: Verify Docker for Testcontainers gate
        run: docker version
      - name: Run RLS runtime gate
        run: pnpm test:api:integration:rls-runtime

  rls-runtime-required:
    name: RLS Runtime Required
    if: ${{ always() }}
    needs:
      - rls-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Verify RLS runtime result
        shell: bash
        run: |
          result="${{ needs.rls-runtime.result }}"
          echo "rls-runtime result: ${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::rls-runtime did not complete successfully"
            exit 1
          fi
